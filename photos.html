<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Photos | Andrew Markarian</title>
  <meta name="description" content="Photos by Andrew Markarian: hikes, camping trips and time outdoors in Missouri and beyond.">
  <meta name="theme-color" content="#14181b">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <a class="wordmark" href="index.html">Andrew Markarian</a>
  <nav aria-label="Primary">
    <a href="index.html#work">Work</a>
    <a href="index.html#projects">Projects</a>
    <a href="index.html#about">About</a>
    <a href="index.html#contact">Contact</a>
    <a href="photos.html" aria-current="page">Photos</a>    
  </nav>
</header>

<main id="top">
  <section id="photos" class="block-wide photos-page">
    <div class="photos-head">
      <h1>Photos</h1>
      <div class="filters" id="filters" role="group" aria-label="Filter photos"></div>
    </div>
    <div class="gallery" id="gallery"></div>
    <p class="empty" id="gallery-empty" hidden>No photos yet. Add images to the photos folder and they'll show up here.</p>
  </section>
</main>

<footer class="footer">
  <p>&copy; <span id="year">2026</span> Andrew Markarian &middot; <a href="index.html">Back to home</a></p>
</footer>

<dialog id="lightbox" aria-label="Photo viewer">
  <button class="lb-btn lb-close" id="lb-close" aria-label="Close photo viewer">Close</button>
  <button class="lb-btn lb-prev" id="lb-prev" aria-label="Previous photo">Prev</button>
  <figure>
    <img id="lb-img" alt="">
    <figcaption id="lb-cap"></figcaption>
  </figure>
  <button class="lb-btn lb-next" id="lb-next" aria-label="Next photo">Next</button>
</dialog>

<script src="script.js"></script>
</body>
</html>
